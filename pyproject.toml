[project]
name = "biblioteca-digital"
version = "1.0.0"
description = "Sistema de Biblioteca Digital en Django"
requires-python = ">=3.12,<3.14"
dependencies = [
    "asgiref==3.11.1",
    "dj-database-url==3.1.2",
    "Django==6.0.5",
    "django-filter==25.2",
    "djangorestframework==3.17.1",
    "djangorestframework-simplejwt==5.5.1",
    "psycopg==3.3.4",
    "psycopg-binary==3.3.4",
    "PyJWT==2.12.1",
    "python-dotenv==1.2.2",
    "sqlparse==0.5.5",
    "whitenoise==6.12.0",
]

[tool.vercel]
entrypoint = "biblioteca_digital.wsgi:application"
